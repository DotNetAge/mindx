<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="920" height="680" fill="#ffffff"/>
  <text x="460" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">进化链路：从记录到落点</text>

  <!-- 输入源 -->
  <rect x="40" y="280" width="180" height="96" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="130" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">notes / memory</text>
  <text x="130" y="342" text-anchor="middle" font-size="11" fill="#64748b">随手记 · 压缩记忆 · 埋点</text>
  <text x="130" y="360" text-anchor="middle" font-size="11" fill="#94a3b8">零门槛记录</text>

  <path d="M 220 304 Q 250 160 274 152" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="220" y1="324" x2="274" y2="332" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- retrospect -->
  <rect x="280" y="120" width="190" height="64" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="375" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">retrospect</text>
  <text x="375" y="166" text-anchor="middle" font-size="11" fill="#475569">自治执行</text>

  <line x1="470" y1="152" x2="524" y2="144" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- 候选技能 → 质量门 → 落点 -->
  <rect x="530" y="120" width="106" height="48" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="583" y="149" text-anchor="middle" font-size="12" fill="#334155">候选技能</text>
  <line x1="636" y1="144" x2="664" y2="144" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="670" y="120" width="80" height="48" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="710" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">质量门</text>
  <line x1="750" y1="144" x2="774" y2="144" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="780" y="120" width="120" height="48" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
  <text x="840" y="149" text-anchor="middle" font-size="12" fill="#115e59">.agents/skills/</text>

  <!-- deep-review -->
  <rect x="280" y="300" width="190" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="375" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">deep-review</text>
  <text x="375" y="346" text-anchor="middle" font-size="11" fill="#475569">用户触发 · 五路分析</text>

  <!-- 五路落点 -->
  <path d="M 470 316 L 554 240" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
  <path d="M 470 326 L 554 296" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
  <line x1="470" y1="332" x2="554" y2="354" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
  <path d="M 470 340 L 554 412" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
  <path d="M 470 350 L 554 470" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-slate)"/>

  <g font-size="12.5" font-weight="700" fill="#3730a3">
    <rect x="560" y="214" width="330" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="576" y="234">A 公共规则 · 用户授权</text>
    <text x="576" y="252" font-size="11" font-weight="400" fill="#475569">→ AGENTS.md（generate-agents-md 执行）</text>

    <rect x="560" y="272" width="330" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="576" y="292">B 技能沉淀 · 用户确认</text>
    <text x="576" y="310" font-size="11" font-weight="400" fill="#475569">→ 直写 .agents/skills/</text>

    <rect x="560" y="330" width="330" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="576" y="350">C 技能修订提议</text>
    <text x="576" y="368" font-size="11" font-weight="400" fill="#475569">→ skill-creator（单写者 + 履历）</text>

    <rect x="560" y="388" width="330" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="576" y="408">E 招募提议 · 三条件 + 用户裁决</text>
    <text x="576" y="426" font-size="11" font-weight="400" fill="#475569">→ agent-creator</text>

    <rect x="560" y="446" width="330" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="576" y="466">D 日报</text>
    <text x="576" y="484" font-size="11" font-weight="400" fill="#475569">→ daily-report → .agents/reports/</text>
  </g>

  <!-- 定量验收闭环 -->
  <path d="M 840 172 Q 840 586 716 586" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-rose)"/>
  <path d="M 274 586 Q 130 586 130 382" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-rose)"/>
  <rect x="280" y="560" width="430" height="52" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="495" y="582" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">metric compare / baseline —— 定量验收</text>
  <text x="495" y="602" text-anchor="middle" font-size="11" fill="#be123c">帕累托判据 + 混杂清单</text>
  <text x="460" y="650" text-anchor="middle" font-size="12" fill="#94a3b8">每一步写入都有闸门：机器拿不准就请示，不静默改写</text>
</svg>
