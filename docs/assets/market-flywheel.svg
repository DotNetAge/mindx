<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="860" height="600" fill="#ffffff"/>
  <text x="430" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">市场飞轮：评分集中收集 · 进化社区加速</text>

  <!-- 更多用户（顶） -->
  <rect x="315" y="90" width="230" height="72" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="430" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">更多用户</text>
  <text x="430" y="146" text-anchor="middle" font-size="11" fill="#64748b">包成为社区流通资产</text>

  <!-- 真实使用与评分（右） -->
  <rect x="590" y="240" width="230" height="72" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="705" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">真实使用与评分</text>
  <text x="705" y="296" text-anchor="middle" font-size="11" fill="#475569">1-5 分 · rating_avg / rating_count</text>

  <!-- 进化信号（底） -->
  <rect x="315" y="390" width="230" height="72" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">更准的进化信号</text>
  <text x="430" y="446" text-anchor="middle" font-size="11" fill="#475569">跨用户验收 · 劣化被自然淘汰</text>

  <!-- 修订发布（左） -->
  <rect x="40" y="240" width="230" height="72" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="155" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">修订发布</text>
  <text x="155" y="296" text-anchor="middle" font-size="11" fill="#475569">进化版取代旧版</text>

  <!-- 顺时针环 -->
  <path d="M 551 134 Q 705 160 705 234" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 705 318 Q 705 426 551 426" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 309 426 Q 155 426 155 318" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 155 234 Q 155 126 309 126" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

  <text x="430" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">市场飞轮</text>
  <text x="430" y="298" text-anchor="middle" font-size="12" fill="#64748b">每转一圈：包更准 · 信号更密 · 进化更快</text>

  <text x="430" y="520" text-anchor="middle" font-size="13" fill="#64748b">单机 P：一个用户的判定；市场 P：全体用户的众包裁决</text>
  <text x="430" y="546" text-anchor="middle" font-size="12" fill="#94a3b8">单机四因子与社区评分在 metric M4 汇合互证</text>
</svg>
