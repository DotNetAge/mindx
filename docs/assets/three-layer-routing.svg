<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">三层路由与失败兜底</text>

  <!-- L1 Team -->
  <rect x="60" y="80" width="520" height="96" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="118" font-size="16" font-weight="700" fill="#3730a3">Team 职责路由</text>
  <text x="90" y="142" font-size="13" fill="#475569">这件事由谁做？</text>
  <text x="90" y="163" font-size="12" fill="#94a3b8">载体：Team Profile 业务范围 → 成员映射</text>

  <line x1="320" y1="176" x2="320" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- L2 Agent -->
  <rect x="60" y="216" width="520" height="96" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="90" y="254" font-size="16" font-weight="700" fill="#115e59">Agent 领域路由</text>
  <text x="90" y="278" font-size="13" fill="#475569">这个场景用什么方法？</text>
  <text x="90" y="299" font-size="12" fill="#94a3b8">载体：Agent 概览（description）+ 技能清单</text>

  <line x1="320" y1="312" x2="320" y2="346" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- L3 Skill -->
  <rect x="60" y="352" width="520" height="96" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="90" y="390" font-size="16" font-weight="700" fill="#92400e">Skill 方案路由</text>
  <text x="90" y="414" font-size="13" fill="#475569">这件事具体怎么做最优？</text>
  <text x="90" y="435" font-size="12" fill="#94a3b8">载体：技能正文的工作流与注意事项</text>

  <!-- 兜底至人 -->
  <text x="618" y="196" font-size="12" fill="#e11d48">低置信兜底</text>
  <line x1="580" y1="128" x2="654" y2="238" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-rose)"/>
  <line x1="580" y1="264" x2="654" y2="258" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-rose)"/>
  <line x1="580" y1="400" x2="654" y2="278" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-rose)"/>

  <rect x="660" y="220" width="150" height="76" rx="10" fill="#fef2f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="735" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#9f1239">人</text>
  <text x="735" y="272" text-anchor="middle" font-size="12" fill="#be123c">假设选项提问</text>
  <text x="735" y="289" text-anchor="middle" font-size="11" fill="#f43f5e">2-4 个选项附推荐</text>

  <text x="430" y="520" text-anchor="middle" font-size="13" fill="#64748b">错误最多被上抛，不会被吞没——失败兜底是架构的一部分</text>
</svg>
