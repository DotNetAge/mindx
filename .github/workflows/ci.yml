# =============================================================================
# MindX CI Pipeline — Production-grade GitHub Actions
# =============================================================================
# Stages: lint → vet → security → test (race + coverage) → build (matrix)
#
# Triggers:
#   - push to main/develop, all PRs
#   - manual dispatch for debugging
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.all-contributorsrc'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==========================================================================
# Environment defaults
# ==========================================================================
env:
  # 固定到具体补丁版：标准库漏洞随补丁版修复，'1.26' 由 setup-go 解析为最新
  # 补丁版，构建产物因此不可复现（同一 tag 在不同日子构建出不同的标准库版本）。
  GO_VERSION: '1.26.11'
  CGO_ENABLED: 1
  GOLANGCI_LINT_VERSION: v2.9
  MINDX_WORKSPACE: ${{ github.workspace }}/.test

jobs:
  # ==========================================================================
  # Stage 1: Lint — golangci-lint with project config
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go.mod 的 toolchain 与 CI 的 GO_VERSION 是两处声明，漂移时构建产物会
      # 悄悄换掉标准库补丁版（本地构建同理，只要 GOTOOLCHAIN=local）。
      # 这条检查让两处必须一致。
      - name: Verify toolchain matches go.mod
        run: make check-toolchain

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  # ==========================================================================
  # Stage 2: Vet — static analysis
  # ==========================================================================
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Note: vet runs with CGO_ENABLED=1 (set globally) so CGO-dependent
      # packages compile correctly.
      - name: Run go vet
        run: go vet ./...

  # ==========================================================================
  # Stage 3: Security — vulnerability check
  # ==========================================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # 管道必须带 pipefail：GitHub 默认 shell 是 `bash -e {0}`，没有 -o pipefail，
      # 管道退出码取最后一个命令（tee 恒为 0），govulncheck 的失败会被吞掉。
      # 显式 `shell: bash` 让 runner 使用 `bash --noprofile --norc -eo pipefail {0}`，
      # 再叠一层 `set -o pipefail` 防止 shell 被改回。
      - name: Run govulncheck
        shell: bash
        run: |
          set -o pipefail
          # 记录本次扫描所用的工具链补丁版：标准库漏洞随补丁版修复，
          # 只写 go 1.26 无法判断产物是否带洞。
          go version
          govulncheck ./... | tee govulncheck-output.txt

  # ==========================================================================
  # Stage 4: Test — race detector + coverage (matrix: OS)
  # ==========================================================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, vet]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: 1  # race detector requires CGO
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare test workspace
        run: |
          mkdir -p .test
          cp -r config .test/config 2>/dev/null || true
          # DefaultApp(nil) requires mindx home with agents/models/providers/skills
          # 用户数据固定在 ~/.mindx
          MINDX_HOME="$HOME/.mindx"
          mkdir -p "$MINDX_HOME/agents" "$MINDX_HOME/skills" "$MINDX_HOME/sessions" "$MINDX_HOME/settings"
          echo 'models: []' > "$MINDX_HOME/settings/models.yml"
          echo 'providers: []' > "$MINDX_HOME/settings/providers.yml"
        shell: bash

      - name: Run tests with race detector & coverage
        shell: bash
        run: |
          go test \
            -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout=10m \
            -v ./... 2>&1 | tee test-output.txt
        env:
          MINDX_WORKSPACE: ${{ env.MINDX_WORKSPACE }}

      - name: Display coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt
          retention-days: 7

  # ==========================================================================
  # Stage 5: Build verification (matrix: OS + Arch)
  # ==========================================================================
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install musl cross-compiler
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
          # For arm64: install zig as cross-compiler fallback (musl.cc often unreachable from CI)
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            if ! command -v aarch64-linux-musl-gcc &>/dev/null; then
              echo "aarch64-linux-musl-gcc not found, installing zig..."
              ZIG_VER="0.13.0"
              wget -q "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" -O /tmp/zig.tar.xz
              sudo tar xf /tmp/zig.tar.xz -C /usr/local
              sudo ln -sf /usr/local/zig-linux-x86_64-${ZIG_VER}/zig /usr/local/bin/zig
              rm /tmp/zig.tar.xz
              zig version
            fi
          fi

      - name: Get version info
        id: version
        shell: bash
        run: |
          echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo 'dev')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Set musl cross-compiler for Linux (Alpine Docker image uses musl)
          # Note: if a cgo dep with C++ is ever added, Go links via CXX, so both
          # CC and CXX must point at the cross toolchain for arm64.
          if [ "$GOOS" = "linux" ]; then
            if [ "$GOARCH" = "amd64" ]; then
              export CC=x86_64-linux-musl-gcc
            elif [ "$GOARCH" = "arm64" ]; then
              # Use native musl-gcc if available, otherwise fall back to zig
              if command -v aarch64-linux-musl-gcc &>/dev/null; then
                export CC=aarch64-linux-musl-gcc
                export CXX=aarch64-linux-musl-g++
              else
                export CC="zig cc -target aarch64-linux-musl"
                export CXX="zig c++ -target aarch64-linux-musl"
              fi
            fi
          fi
          BINARY_NAME=mindx
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=${{ steps.version.outputs.commit }}
          BUILD_TIME=${{ steps.version.outputs.build_time }}

          go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/DotNetAge/mindx/internal/core.Version=${VERSION#v} \
              -X github.com/DotNetAge/mindx/internal/core.Commit=${COMMIT} \
              -X github.com/DotNetAge/mindx/internal/core.BuildTime=${BUILD_TIME}" \
            -o dist/${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }} \
            .

          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: mindx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7
